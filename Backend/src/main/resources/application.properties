spring.application.name=project
server.port=8080
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=TRACE

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/seventeen_icecream_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET_BASE64}
jwt.expiration-ms=1800000

# React
app.frontend-origin=http://localhost:5173
app.seed.enabled=${SEED_ACCOUNTS:false}

app.payment-proof.dir=./private-payment-proofs

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Direct Sales Bank Transfer and Cheque
sales.payment.account-name=Sathutu Sina Dairies
sales.payment.bank-name=Commercial Bank
sales.payment.bank-branch=Galle Bazar
sales.payment.account-number=91023456
sales.payment.cheque-payee-name=Sathutu Sina Dairies

# Include validation and conflict messages in API error responses
server.error.include-message=always

# Do not expose exception stack traces to browser clients
server.error.include-stacktrace=never



